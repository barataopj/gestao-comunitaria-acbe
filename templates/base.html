<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestão Comunitária ACBE{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{% url 'solicitacoes:listar' %}">Gestão Comunitária ACBE</a>
    {% if user.is_authenticated %}
      <div class="d-flex align-items-center gap-3 text-white">
        <span>{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm" type="submit">Sair</button></form>
      </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}<div class="alert alert-success" role="status">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
