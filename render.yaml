services:
  - type: web
    name: gestao-comunitaria-acbe
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-comunitaria-acbe-db
          property: connectionString

databases:
  - name: gestao-comunitaria-acbe-db
    plan: free
    databaseName: gestao_comunitaria_acbe
    user: gestao_comunitaria_acbe
