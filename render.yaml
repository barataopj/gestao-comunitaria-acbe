services:
  - type: web
    name: gestao-comunitaria-acbe
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: gestao-comunitaria-acbe.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://gestao-comunitaria-acbe.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-comunitaria-acbe-db
          property: connectionString

databases:
  - name: gestao-comunitaria-acbe-db
    plan: free
